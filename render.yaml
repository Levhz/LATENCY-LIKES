services:
  - type: web
    name: ff-like-api
    runtime: python
    plan: starter
    buildCommand: apt-get update -qq && apt-get install -y -qq tor || true; pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /health
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: PYTHON_VERSION
        value: 3.11.9
      - fromGroup: ff-like-secrets
